<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gym – keine Verbindung</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        font-family: system-ui, sans-serif; background: #0b0b0d; color: #f4f4f5; text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { color: #a1a1aa; line-height: 1.5; margin: 0 0 1.5rem; }
      button {
        min-height: 48px; padding: 0 1.25rem; border: 0; border-radius: 12px; font: 600 1rem system-ui, sans-serif;
        background: #f4f4f5; color: #0b0b0d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>Die App muss beim ersten Start einmal online sein. Danach funktioniert das Training auch ohne Netz.</p>
      <button type="button" onclick="location.href='https://gym-alpha-flax.vercel.app/dashboard'">Erneut versuchen</button>
    </main>
  </body>
</html>
